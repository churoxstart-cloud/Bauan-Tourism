{% extends "admin/base_site.html" %}
{% block extrahead %}
{{ block.super }}
<style>
  /* Bauan Tourism Portal: navy / teal / gold (Django 4.2 admin colour variables) */
  :root {
    --primary: #1a8a7c;
    --secondary: #0b3d4c;
    --accent: #d9a441;
    --header-bg: #0b3d4c;
    --header-color: #ffffff;
    --header-branding-color: #d9a441;
    --header-link-color: #ffffff;
    --breadcrumbs-bg: #1a8a7c;
    --breadcrumbs-fg: #e6f4f1;
    --breadcrumbs-link-fg: #ffffff;
    --link-fg: #0b6b60;
    --link-hover-color: #0b3d4c;
    --button-bg: #1a8a7c;
    --button-hover-bg: #146b61;
    --default-button-bg: #0b3d4c;
    --default-button-hover-bg: #072a35;
    --object-tools-bg: #0b3d4c;
    --object-tools-hover-bg: #1a8a7c;
    --selected-row: #fff6dc;
  }
  #header { box-shadow: 0 2px 8px rgba(11, 61, 76, 0.35); }
  #site-name a { letter-spacing: .02em; font-weight: 700; }
  .module h2, .module caption, .inline-group h2 { background: #0b3d4c; color: #fff; }
  div.breadcrumbs { background: #1a8a7c; }
  .button, input[type=submit], input[type=button], .submit-row input, a.button { border-radius: 8px; }
  .login #header { background: #0b3d4c; }
</style>
{% endblock %}
