{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:480px;">
  <h5>Resort details — {{ resort.name }}</h5>
  <form method="post">
    {% csrf_token %}
    <div class="mb-2"><label class="form-label">Address</label>{{ form.address }}</div>
    <div class="mb-2"><label class="form-label">Owner name</label>{{ form.owner_name }}</div>
    <div class="mb-2"><label class="form-label">Contact number</label>{{ form.contact_number }}</div>
    <div class="mb-2"><label class="form-label">Total rooms</label>{{ form.total_rooms }}</div>
    <button type="submit" class="btn btn-primary btn-sm">Save</button>
  </form>
</div>
{% endblock %}
