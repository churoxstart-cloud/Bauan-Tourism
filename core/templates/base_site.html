{% extends "admin/base_site.html" %}
{% block extrahead %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body, input, select, textarea, button { font-family: 'Inter', -apple-system, sans-serif !important; }
  #header { background: linear-gradient(90deg, #072a35, #1a8a7c) !important; padding: 14px 30px !important; }
  #header a:link, #header a:visited { color: #f5d98a !important; }
  #branding h1, #branding h1 a { color: #fff !important; font-weight: 700 !important; font-size: 20px !important; }
  div.breadcrumbs { background: #072a35 !important; color: #cfe0e0 !important; border: none !important; padding: 8px 30px !important; }
  div.breadcrumbs a { color: #f5d98a !important; }
  a:link, a:visited { color: #0b6e63 !important; }

  #nav-sidebar .section {
    background: #0b3d4c !important;
    color: #fff !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    padding: 12px 16px !important;
    line-height: 1.5 !important;
    position: static !important;
    overflow: visible !important;
    height: auto !important;
    min-height: 0 !important;
    display: block !important;
    text-transform: none !important;
    letter-spacing: normal !important;
    white-space: normal !important;
  }
  #nav-sidebar tr th, #nav-sidebar tr td { padding: 9px 16px !important; }
  #nav-sidebar tr th a { font-size: 13.5px !important; color: #1a3d40 !important; }
  #nav-sidebar .addlink {
    background: #d9a441 !important; color: #fff !important;
    padding: 3px 10px !important; border-radius: 10px !important;
    font-size: 11px !important; font-weight: 600 !important;
  }
  #nav-sidebar .addlink:before { display: none !important; }
  #nav-sidebar tr:hover { background: #f0f5f4 !important; }

  #content-main h1 { font-size: 20px !important; color: #0b3d4c !important; }
  .module h2, .module caption, .inline-group h2 { background: #0b3d4c !important; color: #fff !important; padding: 8px 14px !important; }

  .button, input[type="submit"], input[type="button"], .submit-row input, a.button {
    background: #1a8a7c !important; color: #fff !important;
    border-radius: 5px !important; border: none !important;
    font-weight: 600 !important; padding: 8px 16px !important;
  }
  .button:hover, input[type="submit"]:hover { background: #072a35 !important; }
  .object-tools a { background: #0b3d4c !important; color: #f5d98a !important; border-radius: 5px !important; }

  #toolbar { display: flex; justify-content: center; padding: 16px; background: #f0f5f4 !important; border-radius: 8px; margin-bottom: 14px; }
  #toolbar form { display: flex; gap: 8px; max-width: 460px; width: 100%; }
  #searchbar { border: 2px solid #1a8a7c !important; border-radius: 5px !important; padding: 8px 12px !important; flex: 1; }
  #toolbar input[type="submit"] { background: #1a8a7c !important; border-radius: 5px !important; }

  #changelist-filter { border-radius: 8px; overflow: hidden; border: 1px solid #e0e6e5 !important; }
  #changelist-filter h2 { background: #0b3d4c !important; color: #fff !important; padding: 10px 14px !important; font-size: 12px !important; }
  #changelist-filter ul { padding: 0 14px 10px !important; }

  #result_list th a { color: #0b3d4c !important; font-weight: 700 !important; }
</style>
{% endblock %}
