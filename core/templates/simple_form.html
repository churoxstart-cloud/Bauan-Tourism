{% extends "base.html" %}
{% block content %}
<div class="container-fluid" style="max-width:560px;">
  <h4 class="mb-3">{{ title }}</h4>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
    {% endif %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-sm">Save</button>
    <a href="{% url back_url %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
  </form>
</div>
{% endblock %}
